name: release-candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Tripo.Rhino.sln
      - name: Build
        run: dotnet build Tripo.Rhino.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Tripo.Rhino.sln --configuration Release --no-build
      - name: Assemble candidate
        shell: pwsh
        run: ./packaging/New-ReleaseCandidate.ps1 -Version "${{ github.ref_name }}"
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tripo-rhino-${{ github.ref_name }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
