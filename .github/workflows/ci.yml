name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-gate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Tripo.Rhino.sln
      - name: Build
        run: dotnet build Tripo.Rhino.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Tripo.Rhino.sln --configuration Release --no-build
